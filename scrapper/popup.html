<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collected</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/listen.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="is-popup">
  <main class="canvas">
    <div class="view" id="target-active-view">
      <img class="lockup" src="assets/epa-lockup.jpg" alt="EPA Punjab" width="168" height="168">
      <div class="head">
        <h1>Collected</h1>
        <div class="head-actions">
          <button type="button" class="hit primary" id="pop-btn-autoscroll" aria-pressed="false">
            <span class="face" id="pop-autoscroll-text">Auto-scroll</span>
          </button>
        </div>
        <p class="finding" id="pop-finding">0 posts on this search. Users still at 0.</p>
      </div>
      <p class="scope">
        <span class="dot" id="pop-status-dot"></span>
        <span id="pop-page-kind">This page.</span>
        <span class="status" id="pop-status-text">Ready</span>
        <span class="hint" id="pop-hint"></span>
      </p>
      <div class="tally" role="radiogroup" aria-label="Collected on this page">
        <button type="button" class="cell" data-kind="posts" id="pop-tab-posts" role="radio" aria-checked="true">
          <span class="cell-label">Posts</span>
          <span class="cell-num num is-zero" id="pop-posts-count">0</span>
        </button>
        <button type="button" class="cell" data-kind="users" id="pop-tab-users" role="radio" aria-checked="false">
          <span class="cell-label">Users</span>
          <span class="cell-num num is-zero" id="pop-users-count">0</span>
        </button>
        <button type="button" class="cell" data-kind="trends" id="pop-tab-trends" role="radio" aria-checked="false">
          <span class="cell-label">Trends</span>
          <span class="cell-num num is-zero" id="pop-trends-count">0</span>
        </button>
      </div>
      <div class="actions" id="export-row">
        <p class="export-label" id="pop-export-label">Export posts</p>
        <button type="button" class="hit quiet" id="pop-export-csv" disabled><span class="face">CSV</span></button>
        <button type="button" class="hit quiet" id="pop-export-json" disabled><span class="face">JSON</span></button>
        <button type="button" class="hit quiet" id="pop-export-excel" disabled><span class="face">Excel</span></button>
        <span class="push"><button type="button" class="hit quiet" id="btn-toggle-overlay"><span class="face">Open panel</span></button></span>
      </div>
      <p class="finding" id="pop-note" role="status"></p>
    </div>
    <div class="view" id="target-inactive-view" hidden>
      <img class="lockup" src="assets/epa-lockup.jpg" alt="EPA Punjab" width="168" height="168">
      <div class="head" id="away-head">
        <div class="head-actions">
          <button type="button" class="hit primary" id="btn-open-x"><span class="face">Open X</span></button>
        </div>
        <p class="finding">Open a search, a profile, or Explore on X.</p>
      </div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
