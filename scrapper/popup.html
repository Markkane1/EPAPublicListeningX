<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPA Punjab Social Listening</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon48.png" width="26" height="26" class="brand-logo" alt="EPA Punjab Social Listening" style="border-radius: 4px; object-fit: contain;">
        <span class="brand-title">EPA Punjab Social Listening</span>
      </div>
      <span class="version-tag">Official</span>
    </header>

    <div id="target-active-view">
      <div class="status-box">
        <div class="status-row">
          <span class="status-indicator">
            <span class="dot live"></span>
            <span class="status-label">Connected to X.com</span>
          </span>
          <button id="btn-toggle-overlay" class="btn-sm">Show Panel</button>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-num" id="pop-posts-count">0</span>
          <span class="metric-label">Posts</span>
        </div>
        <div class="metric-card">
          <span class="metric-num" id="pop-users-count">0</span>
          <span class="metric-label">Users</span>
        </div>
        <div class="metric-card">
          <span class="metric-num" id="pop-trends-count">0</span>
          <span class="metric-label">Trends</span>
        </div>
      </div>

      <div class="actions-group">
        <button id="pop-btn-autoscroll" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span id="pop-autoscroll-text">Start Auto-Scroll</span>
        </button>

        <div class="export-row">
          <button id="pop-export-csv" class="btn-secondary">Export CSV</button>
          <button id="pop-export-json" class="btn-secondary">Export JSON</button>
          <button id="pop-export-excel" class="btn-secondary">Excel</button>
        </div>
      </div>
    </div>

    <div id="target-inactive-view" style="display: none;">
      <div class="inactive-box">
        <p>Open <strong>X.com</strong> or <strong>Twitter.com</strong> to begin extracting posts, user lists, and trending topics.</p>
        <button id="btn-open-x" class="btn-primary" style="margin-top: 12px; width: 100%;">
          Open X.com
        </button>
      </div>
    </div>

    <footer class="popup-footer">
      <span>100% Unlocked • Unlimited Local Scraping</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
